<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Saathi pilot admin</title><link rel="stylesheet" href="/app.css"></head><body><main class="auth-screen"><section class="auth-card"><h1>Saathi pilot</h1><label>Admin code<input id="admin-code" data-testid="admin-code" type="password"></label><button id="load-admin" data-testid="admin-load" class="primary">Load teacher list</button><a id="admin-csv" data-testid="admin-csv" download>Download CSV</a><p id="admin-message"></p><div class="table-wrap"><table><thead><tr><th>Username</th><th>Signed up</th><th>Classes</th><th>Lessons</th><th>Sheets</th><th>Last active</th><th>Cost total</th><th>Action</th></tr></thead><tbody id="admin-teachers"></tbody></table></div></section></main><script>const code=()=>document.getElementById('admin-code').value;async function load(){const headers={'X-Admin-Code':code()};const r=await fetch('/admin/pilot',{headers});if(!r.ok){document.getElementById('admin-message').textContent='Admin access denied.';return}const data=await r.json();document.getElementById('admin-csv').href='/admin/pilot.csv';document.getElementById('admin-teachers').replaceChildren(...data.teachers.map(t=>{const tr=document.createElement('tr');tr.innerHTML='<td>'+t.username+'</td><td>'+t.created_at+'</td><td>'+t.classes+'</td><td>'+t.lessons+'</td><td>'+t.sheets_uploaded+'</td><td>'+t.last_active+'</td><td>'+t.cost_total+'</td><td><button data-testid="admin-reset-'+t.id+'">Reset password</button></td>';tr.querySelector('button').onclick=async()=>{const x=await fetch('/admin/pilot/'+t.id+'/reset-password',{method:'POST',headers});document.getElementById('admin-message').textContent=x.ok?'Temporary password: '+(await x.json()).temporary_password:'Reset failed.'};return tr}))}document.getElementById('load-admin').onclick=load;</script></body></html>
